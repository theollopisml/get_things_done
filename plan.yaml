# Plan d'implémentation V1 volontairement simple.
#
# Passer une tâche à `done: true` uniquement lorsqu'elle est implémentée et
# vérifiée. Passer une slice à `done: true` uniquement lorsque toutes ses
# tâches sont terminées et que la slice est fonctionnelle et testée.

