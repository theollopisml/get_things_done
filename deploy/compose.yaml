name: get-things-done

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: get_things_done
      POSTGRES_USER: gtd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gtd -d get_things_done']
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [database]

  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable image digest}
    restart: unless-stopped
    init: true
    env_file: ${APP_ENV_FILE:-./app.env}
    environment:
      DATABASE_URL: postgresql://gtd:${POSTGRES_PASSWORD}@db:5432/get_things_done
      HOST: 0.0.0.0
      PORT: '3000'
    depends_on:
      db:
        condition: service_healthy
    networks: [database, web]
    stop_grace_period: 45s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - '${HTTPS_BIND_ADDRESS:?Set a VPN or loopback address}:443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on: [app]
    networks: [web]

volumes:
  postgres_data:

networks:
  database:
    internal: true
  web:
